<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Панель управления Складом</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand">Управление БД</span>
        <div class="d-flex align-items-center">
            <span class="text-light me-3">
                Пользователь: <strong sec:authentication="name">User</strong>
                (<span sec:authentication="principal.authorities">ROLE</span>)
            </span>
            <form th:action="@{/auth/logout}" method="post" class="mb-0">
                <button class="btn btn-outline-danger btn-sm" type="submit">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div th:if="${databaseError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <h5 class="alert-heading">Ошибка базы данных!</h5>
        <p th:text="${databaseError}" class="mb-0"></p>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">Категории (Categories)</h5>
                </div>
                <div class="card-body">
                    <div sec:authorize="hasRole('ROLE_MANAGER')" class="mb-3 p-3 bg-light rounded border">
                        <h6>Добавить категорию</h6>
                        <form th:action="@{/dashboard/categories/create}" method="post">
                            <div class="mb-2">
                                <input type="text" name="name" class="form-control form-control-sm" placeholder="Имя категории" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" name="description" class="form-control form-control-sm" placeholder="Описание" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" name="criteries" class="form-control form-control-sm" placeholder="Критерии" required>
                            </div>
                            <button type="submit" class="btn btn-warning btn-sm w-100 text-dark">Создать категорию</button>
                        </form>
                    </div>

                    <table class="table table-sm table-hover">
                        <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Описание</th>
                            <th sec:authorize="hasRole('ROLE_MANAGER')">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.name}"></td>
                            <td th:text="${cat.description}"></td>
                            <td sec:authorize="hasRole('ROLE_MANAGER')">
                                <form th:action="@{/dashboard/categories/delete/{id}(id=${cat.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-xs" onclick="return confirm('Удалить категорию?')">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Товары (Products)</h5>
                </div>
                <div class="card-body">
                    <div sec:authorize="hasAnyRole('ROLE_STOREKEEPER', 'ROLE_MANAGER')" class="mb-3 p-3 bg-light rounded border">
                        <h6>Добавить товар</h6>
                        <form th:action="@{/dashboard/products/create}" method="post">
                            <div class="mb-2">
                                <input type="text" name="name" class="form-control form-control-sm" placeholder="Название товара" required>
                            </div>
                            <div class="mb-2">
                                <input type="text" name="manufacturer" class="form-control form-control-sm" placeholder="Производитель" required>
                            </div>
                            <div class="mb-2">
                                <input type="number" name="cost" class="form-control form-control-sm" placeholder="Цена" required>
                            </div>
                            <div class="mb-2">
                                <select name="categoryId" class="form-select form-select-sm" required>
                                    <option value="" disabled selected>Выберите категорию...</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100">Создать товар</button>
                        </form>
                    </div>

                    <table class="table table-sm table-hover">
                        <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Цена</th>
                            <th>Категория</th>
                            <th sec:authorize="hasRole('ROLE_MANAGER')">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="prod : ${products}">
                            <td th:text="${prod.name}"></td>
                            <td th:text="${prod.cost}"></td>
                            <td th:text="${prod.category!= null? prod.category.name : 'Нет'}"></td>
                            <td sec:authorize="hasRole('ROLE_MANAGER')">
                                <form th:action="@{/dashboard/products/delete/{id}(id=${prod.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-xs" onclick="return confirm('Удалить товар?')">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Поставки (Supplies)</h5>
                </div>
                <div class="card-body">
                    <div sec:authorize="hasAnyRole('ROLE_SUPPLIER', 'ROLE_MANAGER')" class="mb-3 p-3 bg-light rounded border">
                        <h6>Новая поставка</h6>
                        <form th:action="@{/dashboard/deliveries/create}" method="post">
                            <div class="mb-2">
                                <select name="productId" class="form-select form-select-sm" required>
                                    <option value="" disabled selected>Выберите товар...</option>
                                    <option th:each="prod : ${products}" th:value="${prod.id}" th:text="${prod.name}"></option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <input type="number" name="quantity" class="form-control form-control-sm" placeholder="Количество" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm w-100">Создать поставку</button>
                        </form>
                    </div>

                    <table class="table table-sm table-hover">
                        <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Кол-во</th>
                            <th>Статус</th>
                            <th sec:authorize="hasRole('ROLE_MANAGER')">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="del : ${deliveries}">
                            <td th:text="${del.product!= null? del.product.name : 'Нет'}"></td>
                            <td th:text="${del.quantity}"></td>
                            <td><span class="badge bg-secondary" th:text="${del.status}"></span></td>
                            <td sec:authorize="hasRole('ROLE_MANAGER')">
                                <form th:action="@{/dashboard/deliveries/delete/{id}(id=${del.id})}" method="post">
                                    <button type="submit" class="btn btn-danger btn-xs" onclick="return confirm('Удалить поставку?')">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-xs {
          padding: 0.15rem 0.35rem;
          font-size: 0.75rem;
          line-height: 1.2;
          border-radius: 0.2rem;
      }
</style>
</body>
</html>
